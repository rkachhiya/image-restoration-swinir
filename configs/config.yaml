data:
  train_gt_dir: "data/train/GT"
  train_lr_dir: "data/train/NoisyLR"
  test_lr_dir: "data/NoisyLR"
  val_split: 0.1
  num_workers: 4
  pin_memory: true

model:
  name: "SwinIR"
  in_channels: 1
  out_channels: 1
  embed_dim: 60
  depths: [6, 6, 6, 6]
  num_heads: [6, 6, 6, 6]
  window_size: 8
  mlp_ratio: 2.0
  upscale: 2
  img_size: 64
  resi_connection: "1conv"

training:
  epochs: 45
  batch_size: 16
  patch_size_lr: 64
  patch_size_gt: 128
  optimizer:
    type: "AdamW"
    lr: 5.0e-4
    betas: [0.9, 0.999]
    weight_decay: 0.01
  scheduler:
    type: "CosineAnnealingWarmRestarts"
    T_0: 50
    T_mult: 2
    eta_min: 1.0e-7
  loss:
    charbonnier_weight: 1.0
    fft_weight: 0.0
    ssim_weight: 0.05
    edge_weight: 0.05
    dwt_weight: 0.0
    perceptual_weight: 0.0
    charbonnier_eps: 1.0e-6
  use_amp: false
  use_ema: true
  ema_decay: 0.999
  grad_clip: 1.0
  save_every: 10
  log_every: 50

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation: true
  intensity_scale: [0.9, 1.1]
  intensity_shift: null
  cutmix_prob: 0.3
  noise_injection: true
  noise_sigma: 0.02

inference:
  use_fp16: true
  use_compile: true
  batch_size: 16
  model_path: "weights/best_model.pt"
